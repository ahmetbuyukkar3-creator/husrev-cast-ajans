<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Başvuru</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <style>
    body { background: radial-gradient(ellipse at top, color-mix(in srgb, var(--vurgu) 16%, transparent), transparent 55%), var(--zemin); min-height: 100vh; }
    .b-kap { max-width: 640px; margin: 0 auto; padding: 40px 20px 60px; }
    .b-bas { text-align: center; margin-bottom: 28px; }
    .ajans-logo { width: 56px; height: 56px; border-radius: 16px; display: inline-grid; place-items: center; font-weight: 800; font-size: 20px; color: #140F08; background: var(--vurgu); margin-bottom: 14px; box-shadow: 0 10px 40px color-mix(in srgb, var(--vurgu) 35%, transparent); }
    .b-bas h1 { font-family: var(--baslik); font-size: 32px; margin-bottom: 6px; }
    .b-bas p { color: var(--soluk); margin: 0; }
    .adim-cubuk { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
    .adim-cubuk div { font-size: 12px; color: var(--soluk); }
    .adim-cubuk div::before { content: ''; display: block; height: 4px; border-radius: 99px; background: var(--kart2); margin-bottom: 8px; }
    .adim-cubuk div.tamam::before, .adim-cubuk div.su::before { background: var(--vurgu); }
    .adim-cubuk div.su { color: var(--yazi); font-weight: 600; }
    .b-kart { background: var(--kart); border: 1px solid var(--cizgi); border-radius: 20px; padding: 26px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--golge); }
    .b-kart h2 { font-size: 20px; }
    .secim { display: flex; flex-wrap: wrap; gap: 8px; }
    .secim label { cursor: pointer; }
    .secim input { display: none; }
    .secim span { display: inline-block; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--cizgi); background: var(--zemin2); font-size: 14px; transition: all .15s; }
    .secim input:checked + span { background: color-mix(in srgb, var(--vurgu) 20%, transparent); border-color: var(--vurgu); color: var(--yazi); }
    .b-alt { display: flex; justify-content: space-between; gap: 10px; margin-top: 6px; }
    .foto-yukle { display: grid; place-items: center; gap: 8px; padding: 30px; border: 2px dashed var(--cizgi); border-radius: 16px; text-align: center; color: var(--soluk); cursor: pointer; }
    .foto-yukle:hover { border-color: var(--vurgu); }
    .onizlemeler { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .onizlemeler img { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 10px; }
    .onay { display: flex; gap: 10px; font-size: 13px; color: var(--soluk); align-items: flex-start; }
    .onay input { accent-color: var(--vurgu); margin-top: 3px; }
    .basari { text-align: center; padding: 40px 26px; }
    .basari .ik { font-size: 54px; }
    .b-dip { text-align: center; color: var(--soluk); font-size: 12px; margin-top: 26px; }
    .b-dip a { color: var(--altin2); text-decoration: none; }
  </style>
</head>
<body>
  <div class="b-kap" id="kok"></div>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script>
  (function () {
    const e = U.esc;
    const a = H.ajansSlug(new URLSearchParams(location.search).get('ajans')) || H.ajans('a1');
    document.documentElement.style.setProperty('--vurgu', a.renk);
    document.title = a.ad + ' — Yetenek başvurusu';
    const ADIMLAR = ['Kişisel', 'Fiziksel', 'Yetenekler', 'Fotoğraf'];
    const f = { tur: 'Manken', cinsiyet: 'Kadın', diller: [], beceriler: [], deneyim: 'Yeni' };
    let adim = 0, fotolar = [];

    const secim = (ad, liste, coklu) => `<div class="secim">${liste.map(v => `<label><input type="${coklu ? 'checkbox' : 'radio'}" name="${ad}" value="${v}" ${(coklu ? f[ad].includes(v) : f[ad] === v) ? 'checked' : ''}><span>${v}</span></label>`).join('')}</div>`;
    const deger = k => f[k] == null ? '' : e(f[k]);

    const govdeler = [
      () => `<h2>Seni tanıyalım</h2>
        <div class="izgara2"><div class="alan"><label>Ad</label><input class="girdi" name="ad" value="${deger('ad')}"></div><div class="alan"><label>Soyad</label><input class="girdi" name="soyad" value="${deger('soyad')}"></div></div>
        <div class="alan"><label>Cinsiyet</label>${secim('cinsiyet', ['Kadın', 'Erkek'])}</div>
        <div class="izgara2"><div class="alan"><label>Yaş</label><input class="girdi" type="number" name="yas" value="${deger('yas')}"></div><div class="alan"><label>Şehir</label><input class="girdi" name="sehir" value="${deger('sehir') || 'İstanbul'}"></div></div>
        <div class="izgara2"><div class="alan"><label>Telefon</label><input class="girdi" name="telefon" placeholder="05xx xxx xx xx" value="${deger('telefon')}"></div><div class="alan"><label>E-posta</label><input class="girdi" type="email" name="eposta" value="${deger('eposta')}"></div></div>`,
      () => `<h2>Fiziksel özellikler</h2>
        <div class="alan"><label>Hangi alanda çalışmak istiyorsun?</label>${secim('tur', ['Manken', 'Oyuncu', 'Figüran', 'Çocuk'])}</div>
        <div class="izgara2"><div class="alan"><label>Boy (cm)</label><input class="girdi" type="number" name="boy" value="${deger('boy')}"></div><div class="alan"><label>Kilo (kg)</label><input class="girdi" type="number" name="kilo" value="${deger('kilo')}"></div></div>
        <div class="alan"><label>Saç rengi</label>${secim('sac', ['Siyah', 'Kahverengi', 'Kumral', 'Sarı', 'Kızıl'])}</div>
        <div class="alan"><label>Göz rengi</label>${secim('goz', ['Kahverengi', 'Ela', 'Yeşil', 'Mavi', 'Siyah'])}</div>`,
      () => `<h2>Yetenekler ve deneyim</h2>
        <div class="alan"><label>Konuştuğun diller</label>${secim('diller', ['İngilizce', 'Almanca', 'Fransızca', 'Rusça', 'Arapça', 'İspanyolca'], true)}</div>
        <div class="alan"><label>Becerilerin</label>${secim('beceriler', ['Dans', 'Şarkı', 'Yüzme', 'Binicilik', 'Dövüş sanatları', 'Piyano', 'Gitar', 'Aksan', 'Doğaçlama', 'Ehliyet', 'Kayak', 'Tenis'], true)}</div>
        <div class="alan"><label>Deneyim</label>${secim('deneyim', ['Yeni', 'Orta', 'Deneyimli'])}</div>`,
      () => `<h2>Fotoğrafların</h2>
        <label class="foto-yukle"><span style="font-size:30px">📷</span><b style="color:var(--yazi)">Fotoğraf seç</b><span style="font-size:13px">Yüz ve boy fotoğrafı; en fazla 4 adet</span><input type="file" accept="image/*" multiple hidden id="dosya"></label>
        <div class="onizlemeler" id="onizleme">${fotolar.map(s => `<img src="${s}" alt="">`).join('')}</div>
        <label class="onay"><input type="checkbox" id="kvkk">Bilgilerimin ${e(a.ad)} tarafından casting süreçlerinde kullanılmasını ve yapım şirketleriyle paylaşılmasını kabul ediyorum.</label>`
    ];

    function topla() {
      document.querySelectorAll('#kok input.girdi').forEach(i => f[i.name] = i.value.trim());
      ['cinsiyet', 'tur', 'sac', 'goz', 'deneyim'].forEach(k => { const c = document.querySelector(`input[name="${k}"]:checked`); if (c) f[k] = c.value; });
      ['diller', 'beceriler'].forEach(k => { if (document.querySelector(`input[name="${k}"]`)) f[k] = [...document.querySelectorAll(`input[name="${k}"]:checked`)].map(c => c.value); });
    }
    function kontrol() {
      if (adim === 0 && (!f.ad || !f.soyad || !f.yas || !f.telefon)) return 'Ad, soyad, yaş ve telefonu doldurun';
      if (adim === 1 && (!f.boy || !f.kilo)) return 'Boy ve kiloyu yazın';
      return '';
    }

    function ciz() {
      document.getElementById('kok').innerHTML = `
        <div class="b-bas"><span class="ajans-logo">${e(a.kisa)}</span><h1>${e(a.ad)}</h1><p>Yetenek başvuru formu · yaklaşık 3 dakika</p></div>
        <div class="adim-cubuk">${ADIMLAR.map((s, i) => `<div class="${i < adim ? 'tamam' : i === adim ? 'su' : ''}">${i + 1}. ${s}</div>`).join('')}</div>
        <form class="b-kart" id="form">${govdeler[adim]()}
          <div class="b-alt">${adim ? '<button type="button" class="btn" id="geri">← Geri</button>' : '<span></span>'}
          <button class="btn btn-ana">${adim === ADIMLAR.length - 1 ? 'Başvuruyu gönder' : 'Devam →'}</button></div>
        </form>
        <div class="b-dip"><a href="index.html">Hüsrev Cast Ajans</a> altyapısıyla</div>`;
      const g = document.getElementById('geri'); if (g) g.onclick = () => { topla(); adim--; ciz(); };
      const d = document.getElementById('dosya');
      if (d) d.onchange = () => {
        [...d.files].slice(0, 4 - fotolar.length).forEach(file => {
          const r = new FileReader(); r.onload = () => { fotolar.push(r.result); document.getElementById('onizleme').innerHTML = fotolar.map(s => `<img src="${s}" alt="">`).join(''); }; r.readAsDataURL(file);
        });
      };
      document.getElementById('form').onsubmit = ev => {
        ev.preventDefault(); topla();
        const h = kontrol(); if (h) return U.toast(h);
        if (adim < ADIMLAR.length - 1) { adim++; ciz(); window.scrollTo(0, 0); return; }
        if (!document.getElementById('kvkk').checked) return U.toast('Devam etmek için onay kutusunu işaretleyin');
        gonder();
      };
    }

    function gonder() {
      const RENK = [['#F3B562', '#E2557B'], ['#6A8DFF', '#9B5CF6'], ['#2EC4B6', '#3A86FF'], ['#F15BB5', '#9B5DE5']];
      H.db.yetenekler.push({
        id: H.yeniId('y'), ajans: a.id, ad: f.ad, soyad: f.soyad, cinsiyet: f.cinsiyet, tur: f.tur,
        yas: +f.yas, boy: +f.boy, kilo: +f.kilo, sac: f.sac || '—', goz: f.goz || '—', sehir: f.sehir || '—',
        diller: f.diller, beceriler: f.beceriler, deneyim: f.deneyim, telefon: f.telefon, eposta: f.eposta || '—',
        renk: RENK[Math.floor(Math.random() * RENK.length)], durum: 'bekliyor', eklenme: Date.now()
      });
      H.hareket(`Yeni başvuru: ${f.ad} ${f.soyad}`);
      H.kaydet();
      document.getElementById('kok').innerHTML = `
        <div class="b-bas"><span class="ajans-logo">${e(a.kisa)}</span><h1>${e(a.ad)}</h1></div>
        <div class="b-kart basari"><div class="ik">🎬</div><h2>Başvurun alındı, ${e(f.ad)}!</h2>
          <p style="color:var(--soluk);margin:0">${e(a.ad)} ekibi profilini inceleyecek. Uygun bir proje olduğunda seninle iletişime geçecekler.</p>
          <div><button class="btn" onclick="location.reload()">Yeni başvuru</button></div></div>
        <div class="b-dip"><a href="index.html">Hüsrev Cast Ajans</a> altyapısıyla</div>`;
    }
    ciz();
  })();
  </script>
</body>
</html>
