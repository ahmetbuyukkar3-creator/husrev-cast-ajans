<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hüsrev Cast Ajans — Panel</title>
  <script>
    // tema: varsayılan koyu (K-013); kullanıcının seçimi tarayıcıda saklanır
    try { document.documentElement.setAttribute('data-tema', localStorage.getItem('husrev.tema') || 'koyu'); } catch (e) { document.documentElement.setAttribute('data-tema', 'koyu'); }
  </script>
  <link rel="icon" href="img/ajans-yuz.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20260926c">
  <link rel="stylesheet" href="css/koyu.css?v=20260926c">
</head>
<body>
  <div class="bg-fx" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="grid"></i></div>
  <div id="app"></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="js/core.js?v=20260926c"></script>
  <script src="js/store.js?v=20260926c"></script>
  <script src="js/ui.js?v=20260926c"></script>
  <script src="js/form.js?v=20260926c"></script>
  <script src="js/views-yetenek.js?v=20260926c"></script>
  <script src="js/views-proje.js?v=20260926c"></script>
  <script src="js/views-diger.js?v=20260926c"></script>
  <script src="js/dalga.js?v=20260926c"></script>
  <script>
    C.load();
    // Deneme kolaylığı: ?giris=u1 ile doğrudan o kullanıcıyla açılır
    var demo = location.search.match(/[?&]giris=(\w+)/);
    if (demo && C.get('users', demo[1])) C.login(demo[1]);
    // Sol menüdeki ajans görseline su dalgası: menü her yeniden çizildiğinde yeni tuvali başlat
    new MutationObserver(function () {
      var cv = document.getElementById('brandCanvas');
      if (cv && !cv.dataset.basladi) { cv.dataset.basladi = '1'; C.dalga(cv, { gorsel: 'img/ajans.jpg', odakY: 0.3, damlaAralik: 1400, damlaGuc: 0.6 }); }
    }).observe(document.getElementById('app'), { childList: true, subtree: true });
    window.addEventListener('hashchange', C.render);
    C.render();
  </script>
</body>
</html>
